server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: tender-bid-assistant-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tender_bid_assistant}
    username: ${SPRING_DATASOURCE_USERNAME:tender}
    password: ${SPRING_DATASOURCE_PASSWORD:tender_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  attachment-bucket: ${ATTACHMENT_BUCKET:tender-attachments}

management:
  endpoints:
    web:
      exposure:
        include: health,info
